川先生），还是想去舒适区外面逛逛。自动化部署并不是什么难事，记得以前网上就可以找到…" data-tags="Docker · Linux · Blog" data-read="2162 字 · 约 5 分钟">Docker博客环境封装及自动化部署</a></li><li class="arch-row"><time datetime="2018-10-10T07:15:37+08:00">10-10</time> <a href="/posts/a0c49a8e/" data-bubble data-desc="Docker是个好东西，或者说容器是个好东西。 毕竟回忆里的昨天,我再也回不去。 但容器可以。" data-tags="Docker · Linux · CUDA · TensorFlow · OwnCloud" data-read="2480 字 · 约 6 分钟">Time Machine</a></li><li class="arch-row"><time datetime="2018-10-08T19:40:58+08:00">10-08</time> <a href="/posts/9dfc9fe0/" data-bubble data-desc="又不记得有多久没来了。稀里糊涂的过着日子，稀里糊涂的毕了业。很多事都是历久愈艰，所以很多习惯才没法坚持下去，对于博客这种需要长期维护的事情来说也当是如此。 然而，还是又回来试图挣扎一下了。" data-tags="ubuntu · Linux · Docker · Vim" data-read="2158 字 · 约 5 分钟">不满就折腾小记</a></li></ul></section></main><footer class="site-foot"><p class="foot-motto">多可喜，亦多可悲</p><p class="foot-line">© 1992–2026 dfine <span class="foot-sep">·</span> <span id="busuanzi_container_site_uv" hidden>访客 <span id="busuanzi_value_site_uv"></span></span> <span id="busuanzi_container_site_pv" hidden><span class="foot-sep">·</span> 浏览 <span id="busuanzi_value_site_pv"></span></span> <span class="foot-sep">·</span> <a href="/atom.xml">RSS</a></p></footer><script type="application/json" id="acg-config">{"backgrounds":["https://t.alcy.cc/moe","https://www.loliapi.com/acg/","https://api.btstu.cn/sjbz/api.php?lx=dongman&format=images"],"mascot":true,"music":[{"name":"绿茶","artist":"灰灰","url":"/music/lvcha.mp3"},{"name":"赤伶","artist":"等什么君","url":"/music/chiling.mp3"},{"name":"天国うまれ","artist":"甲本ヒロト","url":"/music/tengoku-umare.mp3"}]}</script></body></html>
